<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Quest — Job Prep Research</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #f6f4ec;
      --surface: #fffdf8;
      --ink: #201f2b;
      --ink-2: #55536b;
      --ink-muted: #8c89a3;
      --gridline: #e4e0d0;
      --border: rgba(32, 31, 43, 0.10);
      --good: #0ca30c;
      --good-wash: #e4f7e0;
      --warning: #fab219;
      --warning-wash: #fff3d9;
      --c-overview: #2a78d6;
      --c-overview-wash: #e3eefc;
      --c-bizmodel: #0e8a8a;
      --c-bizmodel-wash: #dcf3f2;
      --c-founders: #1baf7a;
      --c-founders-wash: #e0f7ee;
      --c-timeline: #eda100;
      --c-timeline-wash: #fdf0d6;
      --c-funding: #1c8a1c;
      --c-funding-wash: #e2f4e2;
      --c-products: #4a3aa7;
      --c-products-wash: #e9e5f8;
      --c-challenges: #e34948;
      --c-challenges-wash: #fce3e3;
      --c-jobs: #d1548b;
      --c-jobs-wash: #fbe4ee;
      --critical: #d03b3b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background:
        radial-gradient(circle at 8% 12%, rgba(42,120,214,0.10), transparent 32%),
        radial-gradient(circle at 92% 18%, rgba(237,161,0,0.12), transparent 30%),
        radial-gradient(circle at 15% 88%, rgba(27,175,122,0.12), transparent 32%),
        radial-gradient(circle at 90% 85%, rgba(209,84,139,0.10), transparent 30%),
        var(--page);
      min-height: 100vh;
      color: var(--ink);
    }
    h1, h2, h3, .display { font-family: 'Fredoka', sans-serif; }
    a { color: inherit; }

    /* ---------- landing ---------- */
    .search-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
    .search-box { background: var(--surface); border-radius: 28px; padding: 52px; text-align: center; max-width: 640px; width: 100%; border: 2px solid var(--border); box-shadow: 0 14px 0 rgba(32,31,43,0.06); }

    .landing { max-width: 1080px; margin: 0 auto; padding: 64px 20px 100px; }

    .hero { text-align: center; }
    .hero-inner { max-width: 620px; margin: 0 auto; }
    .quest-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink); background: var(--c-overview-wash); border: 2px solid var(--c-overview); padding: 7px 16px; border-radius: 999px; margin-bottom: 22px; }
    .search-title { font-size: 44px; font-weight: 700; margin-bottom: 14px; }
    .hero-tagline { font-family: 'Fredoka', sans-serif; font-size: 21px; font-weight: 600; color: var(--ink); margin-bottom: 14px; }
    .search-subtitle { color: var(--ink-2); font-size: 15px; margin-bottom: 34px; line-height: 1.6; }

    .search-panel { background: var(--surface); border-radius: 26px; padding: 34px 38px; text-align: left; border: 2px solid var(--border); box-shadow: 0 12px 0 rgba(32,31,43,0.06); }
    .search-prompt { display: flex; align-items: center; gap: 8px; font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 14px; }
    .compass-icon { font-size: 18px; }
    .search-input-wrapper { display: flex; gap: 10px; }
    .search-input { flex: 1; padding: 16px 20px; border-radius: 16px; border: 2px solid var(--border); background: var(--page); color: var(--ink); font-size: 16px; font-family: 'Nunito', sans-serif; font-weight: 700; outline: none; transition: border-color 0.15s; }
    .search-input:focus { border-color: var(--c-overview); }
    .search-input::placeholder { color: var(--ink-muted); font-weight: 600; }
    .btn-game {
      padding: 16px 28px; border-radius: 16px; border: none; cursor: pointer;
      font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; color: #fff;
      background: var(--c-overview); box-shadow: 0 5px 0 #1c5cab; transition: transform 0.08s, box-shadow 0.08s;
    }
    .btn-game:hover:not(:disabled) { filter: brightness(1.05); }
    .btn-game:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #1c5cab; }
    .btn-game:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 14px;
      background: var(--surface); border: 2px solid var(--border); color: var(--ink-2); cursor: pointer;
      font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 600; margin-bottom: 22px;
      box-shadow: 0 3px 0 var(--border); transition: transform 0.08s;
    }
    .btn-ghost:active { transform: translateY(3px); box-shadow: none; }
    .search-hint { margin-top: 12px; font-size: 12px; color: var(--ink-muted); font-weight: 600; line-height: 1.5; }
    .search-hint code { background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px; }
    .error-msg { color: var(--critical); margin-top: 14px; font-size: 14px; font-weight: 700; text-align: left; }
    .warning-banner { background: var(--warning-wash); border: 2px solid var(--warning); color: #7a5200; border-radius: 14px; padding: 14px 18px; font-size: 13px; text-align: left; margin-bottom: 22px; line-height: 1.5; font-weight: 600; }
    .warning-banner code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; }
    .loading-spinner { width: 44px; height: 44px; border: 5px solid var(--gridline); border-top-color: var(--c-overview); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .example-block { margin-top: 24px; text-align: center; }
    .example-label { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 12px; }
    .quest-chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .quest-chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px;
      background: var(--c-overview-wash); border: 2px solid var(--c-overview); color: var(--ink); font-size: 13px;
      font-weight: 700; cursor: pointer; transition: transform 0.1s;
    }
    .quest-chip:hover { transform: translateY(-2px) scale(1.03); }

    .map-divider { display: flex; align-items: center; justify-content: center; gap: 14px; max-width: 560px; margin: 60px auto; color: var(--ink-muted); font-size: 20px; }
    .map-divider::before, .map-divider::after { content: ''; flex: 1; border-top: 3px dashed var(--gridline); }

    .section-kicker { font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 600; text-align: center; color: var(--ink); margin-bottom: 36px; }

    .includes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .includes-card { background: var(--surface); border: 2px solid var(--border); border-top: 5px solid; border-radius: 20px; padding: 26px 24px; box-shadow: 0 5px 0 var(--border); transition: transform 0.12s; }
    .includes-card:hover { transform: translateY(-4px); }
    .includes-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 16px; }
    .includes-title { font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--ink); }
    .includes-text { font-size: 14px; line-height: 1.6; color: var(--ink-2); }

    .rabbit-hole-section { margin-top: 70px; }
    .rabbit-hole-card { max-width: 620px; margin: 0 auto; text-align: center; background: var(--c-timeline-wash); border: 2px dashed var(--c-timeline); border-radius: 24px; padding: 42px 38px; }
    .rabbit-hole-icon { font-size: 30px; display: block; margin-bottom: 14px; }
    .rabbit-hole-title { font-size: 23px; font-weight: 600; margin-bottom: 12px; color: var(--ink); }
    .rabbit-hole-text { font-size: 15px; line-height: 1.7; color: var(--ink-2); }

    .trust-section { margin-top: 60px; max-width: 520px; margin-left: auto; margin-right: auto; text-align: center; }
    .trust-badge { display: inline-flex; align-items: center; gap: 8px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; color: #0a5c0a; background: var(--good-wash); border: 2px solid var(--good); padding: 10px 20px; border-radius: 999px; }
    .trust-text { margin-top: 14px; font-size: 13px; line-height: 1.6; color: var(--ink-muted); font-weight: 600; }

    /* ---------- research view ---------- */
    .container { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
    .header { text-align: center; margin-bottom: 28px; }
    .logo { font-size: 44px; font-weight: 700; margin-bottom: 4px; }
    .source { color: var(--ink-muted); font-size: 13px; font-weight: 700; }
    .stats-bar { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 22px; }
    .stat-tile { background: var(--surface); border: 2px solid var(--border); border-top: 4px solid var(--c-overview); border-radius: 18px; padding: 14px 22px; min-width: 130px; box-shadow: 0 4px 0 var(--border); }
    .stat-value { font-size: 24px; font-weight: 700; font-family: 'Fredoka', sans-serif; color: var(--ink); }
    .stat-label { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin-top: 2px; }

    .progress-wrap { max-width: 480px; margin: 26px auto 6px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    .progress-track { height: 12px; border-radius: 999px; background: var(--gridline); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--c-overview), var(--c-founders), var(--c-timeline)); transition: width 0.4s ease; }

    .celebrate-banner {
      max-width: 640px; margin: 18px auto 0; background: var(--good-wash); border: 2px solid var(--good);
      color: #0a5c0a; border-radius: 16px; padding: 14px 20px; text-align: center; font-weight: 700; font-family: 'Fredoka', sans-serif;
    }

    .quest-map { position: relative; margin: 40px 0 8px; padding: 20px 10px 10px; }
    .quest-path { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; position: relative; }
    .quest-path::before {
      content: ''; position: absolute; left: 4%; right: 4%; top: 34px; height: 0;
      border-top: 3px dashed var(--gridline); z-index: 0;
    }
    .quest-node-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 106px; position: relative; z-index: 1; }
    .quest-node-wrap.offset-up { transform: translateY(-10px); }
    .quest-node-wrap.offset-down { transform: translateY(10px); }
    .quest-node {
      width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer; position: relative;
      display: flex; align-items: center; justify-content: center; font-size: 26px;
      color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,0.18); transition: transform 0.1s, box-shadow 0.1s;
    }
    .quest-node:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }
    .quest-node.active { outline: 4px solid rgba(32,31,43,0.14); outline-offset: 3px; transform: scale(1.08); }
    .quest-node .check-badge {
      position: absolute; top: -4px; right: -4px; width: 22px; height: 22px; border-radius: 50%;
      background: var(--good); border: 2px solid var(--surface); color: #fff; font-size: 12px;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .quest-node-label { font-size: 12px; font-weight: 700; color: var(--ink-2); text-align: center; font-family: 'Fredoka', sans-serif; }

    .content-card { background: var(--surface); border-radius: 22px; border: 2px solid var(--border); box-shadow: 0 6px 0 var(--border); overflow: hidden; margin-top: 28px; }
    .content-stripe { height: 10px; }
    .content-body { padding: 34px; }
    .section-title { font-size: 24px; font-weight: 600; margin-bottom: 22px; display: flex; align-items: center; gap: 12px; }
    .section-icon-badge { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .card-tile { background: var(--page); border-radius: 16px; padding: 20px; border: 2px solid var(--border); }
    .avatar-badge { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
    .founder-name { font-size: 17px; font-weight: 800; }
    .founder-role { color: var(--ink-2); font-weight: 700; font-size: 13px; margin-top: 2px; }
    .founder-bg { color: var(--ink-2); font-size: 14px; margin-top: 12px; line-height: 1.5; }

    .timeline-rail { position: relative; padding-left: 34px; }
    .timeline-rail::before { content: ''; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 4px; border-radius: 4px; background: var(--c-timeline); opacity: 0.35; }
    .timeline-item { position: relative; margin-bottom: 18px; padding: 14px 18px; background: var(--page); border-radius: 14px; border: 2px solid var(--border); }
    .timeline-dot { position: absolute; left: -34px; top: 18px; width: 18px; height: 18px; border-radius: 50%; background: var(--c-timeline); border: 3px solid var(--surface); }
    .timeline-year { font-weight: 800; color: var(--ink); font-family: 'Fredoka', sans-serif; margin-bottom: 2px; }
    .timeline-event { font-size: 14px; line-height: 1.5; }

    .funding-card { text-align: center; border-top: 4px solid var(--c-funding); }
    .funding-round { font-weight: 800; color: var(--ink); font-family: 'Fredoka', sans-serif; }
    .funding-amount { font-size: 24px; font-weight: 800; margin-top: 4px; }
    .funding-valuation { font-size: 13px; color: var(--ink-2); font-weight: 700; margin-top: 4px; }
    .funding-investor { font-size: 13px; color: var(--ink-2); margin-top: 10px; }
    .funding-year { font-size: 11px; color: var(--ink-muted); font-weight: 700; margin-top: 4px; }

    .product-tag { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; background: var(--c-products-wash); color: var(--ink); border-radius: 999px; font-size: 13px; font-weight: 700; margin: 4px; border: 2px solid var(--c-products); }

    .problem-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; background: var(--page); border-radius: 12px; font-size: 14px; margin-bottom: 8px; border: 2px solid var(--border); }
    .bullet-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c-overview); flex-shrink: 0; margin-top: 5px; }

    .challenge-card { background: var(--c-challenges-wash); border: 2px solid var(--c-challenges); border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; }
    .challenge-title { font-weight: 800; margin-bottom: 6px; color: var(--ink); }
    .challenge-details { color: var(--ink-2); font-size: 14px; line-height: 1.6; }

    .insight-card { background: var(--c-jobs-wash); border: 2px solid var(--c-jobs); border-radius: 14px; padding: 18px; }
    .insight-category { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin-bottom: 8px; font-weight: 800; }
    .insight-text { font-size: 14px; line-height: 1.55; }

    .vision-block { font-size: 17px; line-height: 1.6; font-style: italic; font-weight: 700; background: var(--c-overview-wash); padding: 22px; border-radius: 16px; border-left: 6px solid var(--c-overview); }
    .business-model { font-size: 15px; line-height: 1.75; color: var(--ink-2); background: var(--page); padding: 18px; border-radius: 14px; border: 2px solid var(--border); margin-bottom: 22px; }
    .revenue-stream-title { font-size: 16px; font-weight: 800; color: var(--ink); margin-bottom: 8px; }
    .revenue-stream-detail { font-size: 14px; color: var(--ink-2); line-height: 1.6; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 20px; }
    .info-card { background: var(--page); padding: 16px 18px; border-radius: 14px; border: 2px solid var(--border); }
    .info-label { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.04em; }
    .info-value { font-size: 16px; font-weight: 800; margin-top: 4px; }
    .not-available { color: var(--ink-muted); font-size: 14px; font-style: italic; font-weight: 600; }

    .confidence-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 999px; font-family: 'Fredoka', sans-serif; }
    .confidence-verified { background: var(--good-wash); color: #0a5c0a; border: 2px solid var(--good); }
    .confidence-reported { background: var(--warning-wash); color: #7a5200; border: 2px solid var(--warning); }
    .source-block { margin-top: 28px; padding-top: 18px; border-top: 2px dashed var(--gridline); }
    .source-link { font-size: 12px; color: var(--c-overview); text-decoration: none; display: block; margin-top: 6px; font-weight: 700; }
    .source-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // `text` is picked per hue's measured luminance so initials stay >=3:1 —
    // never assume white-on-color reads (aqua/yellow fail white; violet fails dark).
    const SECTIONS = [
      { id: 'overview',   label: 'Overview',   icon: '🏰', color: 'var(--c-overview)', text: '#ffffff' },
      { id: 'businessmodel', label: 'Business Model', icon: '💵', color: 'var(--c-bizmodel)', text: '#ffffff' },
      { id: 'founders',   label: 'Founders',   icon: '🧑‍🤝‍🧑', color: 'var(--c-founders)', text: 'var(--ink)' },
      { id: 'timeline',   label: 'Timeline',   icon: '🕰️', color: 'var(--c-timeline)', text: 'var(--ink)' },
      { id: 'funding',    label: 'Funding',    icon: '💰', color: 'var(--c-funding)', text: '#ffffff' },
      { id: 'products',   label: 'Products',   icon: '🧩', color: 'var(--c-products)', text: '#ffffff' },
      { id: 'challenges', label: 'Challenges', icon: '⚡', color: 'var(--c-challenges)', text: 'var(--ink)' },
      { id: 'jobs',       label: 'Job Insights', icon: '🎯', color: 'var(--c-jobs)', text: 'var(--ink)' }
    ];

    const QUEST_INCLUDES = [
      { icon: '🏢', title: 'The Company', color: 'var(--c-overview)', wash: 'var(--c-overview-wash)', text: "What they do, how they make money, and what they actually sell." },
      { icon: '👋', title: 'The People', color: 'var(--c-founders)', wash: 'var(--c-founders-wash)', text: 'Founders, leadership, and the people shaping the company.' },
      { icon: '💰', title: 'The Money', color: 'var(--c-funding)', wash: 'var(--c-funding-wash)', text: 'Funding rounds, investors, and valuation information where available.' },
      { icon: '🚀', title: 'The Journey', color: 'var(--c-timeline)', wash: 'var(--c-timeline-wash)', text: 'Important milestones, launches, growth, and strategic shifts.' },
      { icon: '⚔️', title: 'The Competition', color: 'var(--c-products)', wash: 'var(--c-products-wash)', text: "Who they're up against and where they fit in the market." },
      { icon: '🧩', title: 'The Challenges', color: 'var(--c-challenges)', wash: 'var(--c-challenges-wash)', text: 'Risks, controversies, product problems, and things worth knowing before your interview.' }
    ];

    function slugify(text) {
      return text.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    function initials(name) {
      return name.split(' ').map(n => n[0]).join('').substring(0, 2);
    }

    function SectionFooter({ section }) {
      if (!section) return null;
      const sources = section.sources || [];
      const verified = section.confidence === 'verified';
      return (
        <div className="source-block">
          <span className={`confidence-badge ${verified ? 'confidence-verified' : 'confidence-reported'}`}>
            {verified ? '✓ Cross-verified' : '⚠ Single source — unconfirmed'}
          </span>
          {sources.length > 0 && (
            <div style={{ marginTop: '10px' }}>
              <span style={{ fontSize: '12px', color: 'var(--ink-muted)', fontWeight: 700 }}>
                {sources.length > 1 ? 'Sources:' : 'Source:'}
              </span>
              {sources.map((s, i) => (
                <a key={i} href={s.url} target="_blank" rel="noopener noreferrer" className="source-link">
                  {s.label || s.url}
                </a>
              ))}
            </div>
          )}
        </div>
      );
    }

    function SectionHeading({ meta, children }) {
      return (
        <h2 className="section-title">
          <span className="section-icon-badge" style={{ background: meta.color }}>{meta.icon}</span>
          {children}
        </h2>
      );
    }

    function EmptySection({ meta, note }) {
      return (
        <div>
          <SectionHeading meta={meta}>{meta.label}</SectionHeading>
          <p className="not-available">{note || 'Not available — no verified information found for this section yet.'}</p>
        </div>
      );
    }

    function Overview({ data, meta }) {
      if (!data) return <EmptySection meta={meta} />;
      return (
        <div>
          <SectionHeading meta={meta}>Company Overview</SectionHeading>
          <p style={{ fontSize: '16px', lineHeight: 1.8, color: 'var(--ink-2)' }}>{data.description || 'No description available.'}</p>

          <div className="info-grid">
            <div className="info-card"><div className="info-label">Founded</div><div className="info-value">{data.founded || 'N/A'}</div></div>
            <div className="info-card"><div className="info-label">Headquarters</div><div className="info-value">{data.headquarters || 'N/A'}</div></div>
            <div className="info-card"><div className="info-label">Industry</div><div className="info-value">{data.industry || 'N/A'}</div></div>
            <div className="info-card"><div className="info-label">Parent</div><div className="info-value">{data.parent || 'N/A'}</div></div>
          </div>

          {data.currentLeader && (
            <>
              <h3 style={{ fontSize: '17px', fontWeight: 700, marginTop: '28px', marginBottom: '14px' }}>Current Leader</h3>
              <div className="card-tile" style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
                <div className="avatar-badge" style={{ background: meta.color, color: meta.text, width: '52px', height: '52px', fontSize: '18px' }}>{initials(data.currentLeader.name)}</div>
                <div>
                  <div className="founder-name">{data.currentLeader.name}</div>
                  <div className="founder-role">{data.currentLeader.role}</div>
                </div>
              </div>
            </>
          )}

          {data.vision && (
            <>
              <h3 style={{ fontSize: '17px', fontWeight: 700, marginTop: '28px', marginBottom: '14px' }}>Vision</h3>
              <div className="vision-block">"{data.vision}"</div>
            </>
          )}

          {data.problemsSolved && data.problemsSolved.length > 0 && (
            <>
              <h3 style={{ fontSize: '17px', fontWeight: 700, marginTop: '28px', marginBottom: '14px' }}>Problems Solved</h3>
              <div>
                {data.problemsSolved.map((problem, i) => (
                  <div key={i} className="problem-row"><span className="bullet-dot"></span>{problem}</div>
                ))}
              </div>
            </>
          )}

          <SectionFooter section={data} />
        </div>
      );
    }

    function BusinessModel({ data, meta }) {
      const items = data && data.items ? data.items : [];
      if (!data || (items.length === 0 && !data.summary)) return <EmptySection meta={meta} />;
      return (
        <div>
          <SectionHeading meta={meta}>How They Make Money</SectionHeading>
          {data.summary && <div className="business-model">{data.summary}</div>}
          {items.length > 0 && (
            <div className="grid">
              {items.map((item, i) => (
                <div key={i} className="card-tile">
                  <div className="revenue-stream-title">💵 {item.stream}</div>
                  <p className="revenue-stream-detail">{item.detail}</p>
                </div>
              ))}
            </div>
          )}
          <SectionFooter section={data} />
        </div>
      );
    }

    function Founders({ data, meta }) {
      const items = data && data.items ? data.items : [];
      if (items.length === 0) return <EmptySection meta={meta} />;
      return (
        <div>
          <SectionHeading meta={meta}>Founders</SectionHeading>
          <div className="grid">
            {items.map((founder, i) => (
              <div key={i} className="card-tile">
                <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '12px' }}>
                  <div className="avatar-badge" style={{ background: meta.color, color: meta.text }}>{initials(founder.name)}</div>
                  <div>
                    <div className="founder-name">{founder.name}</div>
                    <div className="founder-role">{founder.role || 'Founder'}</div>
                  </div>
                </div>
                <p className="founder-bg">{founder.background || 'No background information available.'}</p>
              </div>
            ))}
          </div>
          <SectionFooter section={data} />
        </div>
      );
    }

    function Timeline({ data, meta }) {
      const items = data && data.items ? data.items : [];
      if (items.length === 0) return <EmptySection meta={meta} />;
      return (
        <div>
          <SectionHeading meta={meta}>Company Timeline</SectionHeading>
          <div className="timeline-rail">
            {items.map((item, i) => (
              <div key={i} className="timeline-item">
                <div className="timeline-dot"></div>
                <div className="timeline-year">{item.year}</div>
                <div className="timeline-event">{item.event}</div>
              </div>
            ))}
          </div>
          <SectionFooter section={data} />
        </div>
      );
    }

    function Funding({ data, meta }) {
      const items = data && data.items ? data.items : [];
      if (items.length === 0) return <EmptySection meta={meta} />;
      return (
        <div>
          <SectionHeading meta={meta}>Funding History</SectionHeading>
          <div className="grid">
            {items.map((round, i) => (
              <div key={i} className="card-tile funding-card">
                <div className="funding-round">{round.round}</div>
                <div className="funding-year">{round.year}</div>
                <div className="funding-amount">{round.amount}</div>
                <div className="funding-valuation">{round.valuation ? `Valuation: ${round.valuation}` : ''}</div>
                <div className="funding-investor">{round.investor || ''}</div>
              </div>
            ))}
          </div>
          <SectionFooter section={data} />
        </div>
      );
    }

    function Products({ data, meta }) {
      const items = data && data.items ? data.items : [];
      if (items.length === 0) return <EmptySection meta={meta} />;
      return (
        <div>
          <SectionHeading meta={meta}>Products & Services</SectionHeading>
          <div style={{ marginBottom: '32px' }}>
            {items.map((product, i) => <span key={i} className="product-tag">🧩 {product}</span>)}
          </div>
          <SectionFooter section={data} />
        </div>
      );
    }

    function Challenges({ data, meta }) {
      const items = data && data.items ? data.items : [];
      if (items.length === 0) return <EmptySection meta={meta} note="Not available — no verified, current challenges found for this section." />;
      return (
        <div>
          <SectionHeading meta={meta}>Challenges</SectionHeading>
          {items.map((challenge, i) => (
            <div key={i} className="challenge-card">
              <div className="challenge-title">⚡ {challenge.challenge}</div>
              {challenge.details && <div className="challenge-details">{challenge.details}</div>}
            </div>
          ))}
          <SectionFooter section={data} />
        </div>
      );
    }

    function JobInsights({ data, meta }) {
      // `items` is an open list of { category, text } — the category names
      // are whatever roles/departments the research actually turned up for
      // *this* company (Engineering, Therapists/Clinical, Sales, ...), not a
      // fixed tech-company taxonomy.
      const items = data && data.items ? data.items : [];
      if (items.length === 0) {
        return <EmptySection meta={meta} note="Not available from this source. Worth researching role-specific interview questions and team structure separately before applying." />;
      }
      return (
        <div>
          <SectionHeading meta={meta}>Job Insights</SectionHeading>
          <div className="grid">
            {items.map((insight, i) => (
              <div key={i} className="insight-card">
                <div className="insight-category">{insight.category}</div>
                <div className="insight-text">{insight.text}</div>
              </div>
            ))}
          </div>
          <SectionFooter section={data} />
        </div>
      );
    }

    function ResearchApp({ companyData, onBack }) {
      const [activeTab, setActiveTab] = useState('overview');
      const [visited, setVisited] = useState(new Set(['overview']));
      const overview = companyData.overview || {};

      const selectTab = (id) => {
        setActiveTab(id);
        setVisited(prev => new Set(prev).add(id));
      };

      const renderContent = () => {
        const meta = SECTIONS.find(s => s.id === activeTab);
        switch (activeTab) {
          case 'overview': return <Overview data={overview} meta={meta} />;
          case 'businessmodel': return <BusinessModel data={companyData.businessModel} meta={meta} />;
          case 'founders': return <Founders data={companyData.founders} meta={meta} />;
          case 'timeline': return <Timeline data={companyData.timeline} meta={meta} />;
          case 'funding': return <Funding data={companyData.funding} meta={meta} />;
          case 'products': return <Products data={companyData.products} meta={meta} />;
          case 'challenges': return <Challenges data={companyData.challenges} meta={meta} />;
          case 'jobs': return <JobInsights data={companyData.jobInsights} meta={meta} />;
          default: return <Overview data={overview} meta={meta} />;
        }
      };

      const activeMeta = SECTIONS.find(s => s.id === activeTab);
      const progressPct = Math.round((visited.size / SECTIONS.length) * 100);
      const fullyExplored = visited.size === SECTIONS.length;

      return (
        <div className="container">
          <button className="btn-ghost" onClick={onBack}>← Search another company</button>

          <header className="header">
            <h1 className="logo">🗺️ {companyData.company}</h1>
            <p className="source">Researched {companyData.researchedAt || ''}</p>
            {overview.stats && (
              <div className="stats-bar">
                {overview.stats.monthlyUsers && <div className="stat-tile"><div className="stat-value">{overview.stats.monthlyUsers}</div><div className="stat-label">Monthly users</div></div>}
                {overview.stats.valuation && <div className="stat-tile"><div className="stat-value">{overview.stats.valuation}</div><div className="stat-label">Valuation</div></div>}
                {overview.stats.employees && <div className="stat-tile"><div className="stat-value">{overview.stats.employees}</div><div className="stat-label">Employees</div></div>}
                {overview.stats.revenue && <div className="stat-tile"><div className="stat-value">{overview.stats.revenue}</div><div className="stat-label">Revenue</div></div>}
              </div>
            )}
          </header>

          <div className="progress-wrap">
            <div className="progress-label"><span>Quest progress</span><span>{visited.size}/{SECTIONS.length} explored</span></div>
            <div className="progress-track"><div className="progress-fill" style={{ width: `${progressPct}%` }}></div></div>
          </div>

          {fullyExplored && (
            <div className="celebrate-banner">🎉 Fully explored — you've got the full picture on {companyData.company}.</div>
          )}

          <div className="quest-map">
            <div className="quest-path">
              {SECTIONS.map((s, i) => (
                <div key={s.id} className={`quest-node-wrap ${i % 2 === 1 ? 'offset-down' : 'offset-up'}`}>
                  <button
                    className={`quest-node ${activeTab === s.id ? 'active' : ''}`}
                    style={{ background: s.color }}
                    onClick={() => selectTab(s.id)}
                    title={s.label}
                  >
                    {s.icon}
                    {visited.has(s.id) && <span className="check-badge">✓</span>}
                  </button>
                  <span className="quest-node-label">{s.label}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="content-card">
            <div className="content-stripe" style={{ background: activeMeta.color }}></div>
            <div className="content-body">{renderContent()}</div>
          </div>
        </div>
      );
    }

    function SearchPage({ onSearch, manifest }) {
      const [query, setQuery] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const isFileProtocol = window.location.protocol === 'file:';

      const runSearch = async (name) => {
        if (!name.trim()) return;
        setLoading(true);
        setError('');
        const err = await onSearch(name.trim());
        if (err) setError(err);
        setLoading(false);
      };

      const handleSearch = () => runSearch(query);
      const handleKeyPress = (e) => { if (e.key === 'Enter') handleSearch(); };

      if (loading) {
        return (
          <div className="search-container">
            <div className="search-box">
              <div className="loading-spinner"></div>
              <p style={{ color: 'var(--ink-2)', marginTop: '16px', fontWeight: 700 }}>Scouting the map...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="landing">
          <section className="hero">
            <div className="hero-inner">
              <span className="quest-badge">🧭 A calmer way to prep</span>
              <h1 className="search-title">Company Quest</h1>
              <p className="hero-tagline">Know the company before you interview.</p>
              <p className="search-subtitle">Explore a company's story, people, funding, product, competitors, and challenges — all in one place.</p>

              <div className="search-panel">
                <p className="search-prompt"><span className="compass-icon">🧭</span> Which company are you curious about?</p>

                {isFileProtocol && (
                  <div className="warning-banner">
                    This page was opened directly as a file, so it can't load local data files.
                    Serve this folder instead, e.g. <code>python3 -m http.server 8000</code>, then open
                    <code> http://localhost:8000</code>.
                  </div>
                )}

                <div className="search-input-wrapper">
                  <input
                    type="text"
                    className="search-input"
                    placeholder="e.g. Stripe, Notion, Anthropic..."
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    onKeyPress={handleKeyPress}
                  />
                  <button className="btn-game" onClick={handleSearch} disabled={!query.trim()}>Explore →</button>
                </div>
                <p className="search-hint">Searches companies already explored below. Don't see one? Run <code>/research-company &lt;name&gt;</code> in Claude Code to add it.</p>
                {error && <p className="error-msg">{error}</p>}

                {manifest.length > 0 && (
                  <div className="example-block">
                    <p className="example-label">Try an example</p>
                    <div className="quest-chips">
                      {manifest.map((entry) => (
                        <span key={entry.slug} className="quest-chip" onClick={() => runSearch(entry.name)}>📍 {entry.name}</span>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </section>

          <div className="map-divider" aria-hidden="true"><span>🧭</span></div>

          <section className="includes-section">
            <h2 className="section-kicker">Your quest includes...</h2>
            <div className="includes-grid">
              {QUEST_INCLUDES.map((item) => (
                <div key={item.title} className="includes-card" style={{ borderTopColor: item.color }}>
                  <div className="includes-icon" style={{ background: item.wash, color: item.color }}>{item.icon}</div>
                  <h3 className="includes-title">{item.title}</h3>
                  <p className="includes-text">{item.text}</p>
                </div>
              ))}
            </div>
          </section>

          <section className="rabbit-hole-section">
            <div className="rabbit-hole-card">
              <span className="rabbit-hole-icon">🕸️</span>
              <h2 className="rabbit-hole-title">No more interview-night rabbit holes.</h2>
              <p className="rabbit-hole-text">Company Quest brings the important pieces together so you can spend your time figuring out what actually matters.</p>
            </div>
          </section>

          <section className="trust-section">
            <span className="trust-badge">✓ Your research, cross-checked.</span>
            <p className="trust-text">We check information across independent sources so you can spend less time hunting for facts and more time understanding the company.</p>
          </section>
        </div>
      );
    }

    function App() {
      const [view, setView] = useState('search');
      const [companyData, setCompanyData] = useState(null);
      const [manifest, setManifest] = useState([]);

      useEffect(() => {
        fetch('data/manifest.json')
          .then(r => (r.ok ? r.json() : []))
          .then(setManifest)
          .catch(() => setManifest([]));
      }, []);

      const fetchCompanyData = async (companyName) => {
        const slug = slugify(companyName);
        try {
          const response = await fetch(`data/${slug}.json`);
          if (!response.ok) {
            return `No research yet for "${companyName}".`;
          }
          const data = await response.json();
          setCompanyData(data);
          setView('research');
          return null;
        } catch (err) {
          return `Could not load data for "${companyName}": ${err.message}`;
        }
      };

      if (view === 'research' && companyData) {
        return <ResearchApp companyData={companyData} onBack={() => setView('search')} />;
      }

      return <SearchPage onSearch={fetchCompanyData} manifest={manifest} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
